[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "ktradelink-native"
version = "0.1.0"
description = "Optional local native foundation for KTradeLink; no broker adapters"
requires-python = ">=3.11"
dependencies = ["ktradelink==0.0.0.dev0"]

[tool.maturin]
module-name = "_ktradelink_native"
bindings = "pyo3"
